services:
  ocserv:
    build: .

    container_name: ocserv

    privileged: true

    restart: unless-stopped

    ports:
#      - "192.168.1.2:443:443/tcp"
#     - "192.168.1.2:443:443/udp"
      - "443:443/tcp"
      - "443:443/udp"
#    cap_add:
#      - NET_ADMIN
#      - SYS_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      net.ipv4.ip_forward: "1"

    volumes:
      - ./config/ocserv.conf:/etc/ocserv/ocserv.conf:ro
      - ./certs:/etc/ocserv/certs:ro
      - ./passwd:/etc/ocserv/passwd
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro

    networks:
      - ocserv-net

networks:
  ocserv-net:
    driver: bridge
