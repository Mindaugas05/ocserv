#
# OpenConnect lab server
#

# ============================================================
# Authentication
# ============================================================

# Password authentication
auth = "plain[passwd=/etc/ocserv/passwd/ocpasswd]"

# Control socket
socket-file = /run/ocserv.socket

# VPN device
device = vpns

# Certificate authentication is an alternative to password auth.
# This means:
#
#   username/password -> accepted
#
# OR
#
#   valid client certificate -> accepted
#
enable-auth = "certificate"

# CA used to validate client certificates
ca-cert = /etc/ocserv/certs/ca-cert.pem

# Extract username from certificate CN.
#
# 2.5.4.3 = Common Name (CN)
cert-user-oid = 2.5.4.3


# ============================================================
# Server certificate
# ============================================================

server-cert = /etc/ocserv/certs/server-cert.pem
server-key = /etc/ocserv/certs/server-key.pem


# ============================================================
# Network
# ============================================================

# VPN address pool
ipv4-network = 10.10.10.0
ipv4-netmask = 255.255.255.0

# DNS pushed to clients
dns = 1.1.1.1
dns = 1.0.0.1


# ============================================================
# Listening
# ============================================================

tcp-port = 443
udp-port = 443

# Listen on all addresses INSIDE the container.
#
# Docker itself restricts external access to:
# 192.168.1.2:443
#
# Do not put 192.168.1.2 here because that address belongs
# to the Ubuntu host, not the container.
listen-host = 0.0.0.0
udp-listen-host = 0.0.0.0


# ============================================================
# TLS
# ============================================================

tls-priorities = "NORMAL:%SERVER_PRECEDENCE:%COMPAT:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1"


# ============================================================
# Connection handling
# ============================================================

max-clients = 16
max-same-clients = 2

keepalive = 300
dpd = 60
mobile-dpd = 300

auth-timeout = 240

cookie-timeout = 300

switch-to-tcp-timeout = 25

try-mtu-discovery = false


# ============================================================
# Security / isolation
# ============================================================

isolate-workers = true

run-as-user = nobody
run-as-group = daemon

use-occtl = true


# ============================================================
# Logging
# ============================================================

log-level = 2
